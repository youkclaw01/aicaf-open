name: 소단위 포털 검증
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: app:app/tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: 시험 의존성 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 소스 선별 및 비밀값 검사
        run: python tools/source_policy.py --check-tracked
      - name: 순서·근거·포털 계약 검증
        run: >-
          python -m pytest -q tools/tests
          app/tests/test_three_report_workflow.py
          app/tests/test_assessment_flow_backend.py
          app/tests/test_assessment_flow_portal.py
          app/tests/test_assessment_flow_dependency_bridge.py
          app/tests/test_three_report_fingerprint.py
          app/tests/test_current_state_entry_and_scale.py
          app/tests/test_portal_release_startup.py
          app/tests/test_asis_worker_retry.py
          app/tests/test_portal_integration_recovery.py
