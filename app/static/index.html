<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI CAF Assessment</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── AI Assessment 디자인 시스템 (Apple HIG 기준, 단일 정의) ── */
:root{
 --ink:#1d1d1f;--ink2:#424245;--muted:#6e6e73;--faint:#86868b;
 --bg:#f5f5f7;--surface:#fff;--fill:#e8e8ed;--fill2:#f5f5f7;--line:#d2d2d7;--hair:#ebebf0;
 --blue:#0071e3;--blue-h:#0077ed;--link:#0066cc;--blue-t:#e8f1fc;
 --purple:#8944ab;--purple-t:#f4ecf8;--red:#e30000;--red-t:#fdeeee;--green:#248a3d;--green-t:#eaf6ec;--orange:#b64400;--orange-t:#fdf1e7;
 --r-sm:8px;--r:12px;--r-lg:18px;--pill:980px;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
 --ease:cubic-bezier(.28,.11,.32,1);--shadow:0 4px 24px rgba(0,0,0,.06);
 --navy:var(--ink);--teal:var(--blue);--slate:var(--muted);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 "SF Pro Text",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* 상단 바 */
header{position:sticky;top:0;z-index:10;height:44px;background:rgba(251,251,253,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
header .hdr{max-width:1024px;height:44px;margin:0 auto;padding:0 var(--s5);display:flex;align-items:center;justify-content:space-between}
header .logo{display:flex;opacity:.85}header .logo:hover{opacity:1}
header nav{flex:1;display:flex;justify-content:center;gap:40px}
header nav a{font-size:12px;color:var(--ink);opacity:.8;letter-spacing:-.01em}header nav a:hover{opacity:1;text-decoration:none}
header .me{font-size:12px;color:var(--muted);white-space:nowrap}header .me a{color:var(--ink);opacity:.8}

/* 레이아웃·타이포 */
main{max-width:1024px;margin:0 auto;padding:0 var(--s5) var(--s7)}
.hero{padding:var(--s7) 0 var(--s5)}
.hero h1{margin:0;font-size:40px;line-height:1.1;font-weight:600;letter-spacing:-.03em;color:var(--muted)}
h1 b,h2 b{color:var(--ink);font-weight:600}
h2{margin:0 0 var(--s5);font-size:24px;line-height:1.17;font-weight:600;letter-spacing:-.025em;color:var(--muted)}
h2:not(:has(b)){color:var(--ink)}
h3{margin:0 0 var(--s3);font-size:19px;line-height:1.21;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.q{font-size:17px;font-weight:600;line-height:1.35}
.muted{color:var(--muted);font-size:14px;line-height:1.43;letter-spacing:-.016em}
.hint{margin-left:var(--s2);font-size:14px;font-weight:400;color:var(--faint)}
.score{font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}

/* 카드 */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s6);margin-bottom:var(--s5);box-shadow:var(--shadow)}
.card.row{padding:var(--s4) var(--s6)}
.kpi{background:var(--surface);border-radius:var(--r);padding:var(--s4);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.kpi[role=button]{cursor:pointer}
.kpi[role=button]:hover:not(.on){background:var(--fill2)}
.kpi .v{margin-top:4px;font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.kpi.on{background:var(--blue);color:#fff;box-shadow:0 6px 20px rgba(0,113,227,.24)}
.kpi.on .muted{color:rgba(255,255,255,.86)}
.kpi.on .v,.kpi.on .cx-v{color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}

/* 폼: 라벨 위 · 입력 아래, 3열 그리드 */
.np .lbl{margin:var(--s6) 0 var(--s3);font-size:17px;font-weight:600;color:var(--ink)}
.np .lbl:first-of-type{margin-top:0}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.fg>div,.fg>label{display:flex;flex-direction:column;gap:6px;min-width:0}
.fg small,.fg>label>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.fg input{width:100%}
.fg+.fg{margin-top:var(--s4)}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.16)}
input:disabled{background:var(--fill2);color:var(--muted)}
textarea{width:100%;line-height:1.47}
.actions,.np .act{display:flex;align-items:center;justify-content:space-between;gap:var(--s5);margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--hair)}
.actions{justify-content:flex-end}.np .act p{margin:0;max-width:62ch}

/* 버튼: 채움=흰 글자, 외곽=색 글자, 비활성=회색 */
button{font:inherit;font-size:15px;font-weight:500;line-height:1;border:0;border-radius:var(--pill);padding:11px 20px;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}
button:hover{background:var(--blue-h)}button:active{transform:scale(.97)}
button.sec{background:transparent;color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}button.sec:hover{background:var(--link);color:#fff}
button.rec{background:var(--red);color:#fff;display:inline-flex;align-items:center;gap:var(--s2)}button.rec:hover{background:#c90000}
button.rec .dot,button.rec .sq{width:9px;height:9px;background:currentColor;display:inline-block}button.rec .dot{border-radius:50%}button.rec .sq{border-radius:2px}
button.rec.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,0,0,.4)}50%{box-shadow:0 0 0 8px rgba(227,0,0,0)}}
button.danger{background:var(--red)}button.danger:hover{background:#c90000}
button.del{background:transparent;color:var(--red);padding:6px 12px;font-size:14px}button.del:hover{background:var(--red);color:#fff}
button:disabled,button:disabled:hover{background:var(--fill);color:var(--faint);box-shadow:none;cursor:default;transform:none;animation:none}
.np .act button{font-size:17px;padding:13px 26px}

/* 세그먼트 탭·토픽: 선택=검정 바탕 흰 글자 */
.tabs{display:flex;width:100%;gap:4px;padding:4px;margin:var(--s6) 0 var(--s5);background:var(--fill);border-radius:var(--pill)}
.tabs button{flex:1 1 0;min-width:0}
.tabs button,.topics button{background:transparent;color:var(--ink);font-size:14px;padding:9px 20px}
.tabs button:hover:not(:disabled){background:rgba(255,255,255,.7)}
.tabs button:disabled,.tabs button:disabled:hover{background:transparent;color:var(--faint);opacity:.65}
.tabs button.on,.tabs button.on:hover{background:var(--ink);color:#fff}
.topics{display:flex;gap:6px;flex-wrap:nowrap;margin:var(--s3) 0;width:100%}
.topics button{flex:1 1 0;min-width:0;padding:0 10px;font-size:13px;letter-spacing:-.025em;box-shadow:inset 0 0 0 1px var(--line)}.topics button:hover{background:var(--fill2)}
.topics button.on,.topics button.on:hover{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,113,227,.22)}

/* 표 */
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}
td{font-size:15px;padding:14px var(--s3);border-bottom:1px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* 배지 */
.pill{display:inline-block;padding:3px 10px;border-radius:var(--pill);background:var(--fill2);color:var(--ink2);font-size:12px;font-weight:500;margin-left:0}
.pill.trk-new{background:var(--blue-t);color:var(--link)}.pill.trk-existing{background:var(--purple-t);color:var(--purple)}
.must,.pill.must{background:var(--red-t);color:var(--red)}
.banner{background:var(--orange-t);color:var(--ink);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:14px}
.err{color:var(--red);font-size:14px}.live{color:var(--faint);font-size:14px}

/* 업로드·단계 */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:var(--s6);text-align:center;color:var(--muted);transition:background .2s var(--ease),border-color .2s var(--ease)}
.drop.drag{border-color:var(--blue);background:var(--blue-t)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}

/* 위험 구역 */
.card.danger{box-shadow:inset 0 0 0 1px var(--red-t),var(--shadow)}.card.danger h3{color:var(--red)}

/* 고객 유형 선택 카드 */
.trkc{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.trkc input{position:absolute;opacity:0;pointer-events:none}
.trkc label{position:relative;display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s5);border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .35s var(--ease),box-shadow .35s var(--ease),opacity .35s var(--ease)}
.trkc label:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.trkc .ic svg{width:28px;height:28px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s var(--ease)}
.trkc .t-new .ic svg{stroke:var(--blue)}.trkc .t-ex .ic svg{stroke:var(--purple)}
.trkc .tx b{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:var(--s1);transition:color .35s var(--ease)}
.trkc .tx span{font-size:17px;font-weight:600;line-height:1.41;color:var(--ink)}
.trkc em{font-style:normal}.c-blue{color:var(--blue)}.c-purple{color:var(--purple)}
.trkc .chk{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);position:relative;transition:background .3s var(--ease),box-shadow .3s var(--ease)}
.trkc .chk::after{content:"";position:absolute;left:8px;top:4px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .3s var(--ease)}
.trkc label:has(input:checked) .chk::after{transform:rotate(45deg) scale(1)}
.trkc .t-new:has(input:checked){background:var(--blue);box-shadow:none}
.trkc .t-ex:has(input:checked){background:var(--purple);box-shadow:none}
.trkc label:has(input:checked) .tx b,.trkc label:has(input:checked) .tx span,.trkc label:has(input:checked) em{color:#fff}
.trkc label:has(input:checked) .tx b{opacity:.8}
.trkc label:has(input:checked) .ic svg{stroke:#fff}
.trkc label:has(input:checked) .chk{background:#fff;box-shadow:none}
.trkc .t-new:has(input:checked) .chk::after{border-color:var(--blue)}.trkc .t-ex:has(input:checked) .chk::after{border-color:var(--purple)}
.trkc:has(input:checked) label:not(:has(input:checked)){opacity:.55}

@media (max-width:760px){.fg,.trkc,.grid{grid-template-columns:1fr}.hero h1{font-size:28px}header nav{gap:20px}.card{padding:var(--s5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 버튼 글자 정중앙: 고정 높이 + flex 정렬(한글 글꼴 기준선 차이 흡수) */
button{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:40px;padding:0 20px;line-height:1.2;vertical-align:middle}
.np .act button{height:48px;padding:0 26px}
.tabs button{height:34px;padding:0 18px}
.topics button{height:34px;padding:0 10px}
button.del,a.open{height:30px;padding:0 12px;font-size:14px}
a.open{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--pill);color:var(--link);font-weight:500;line-height:1.2;vertical-align:middle;transition:background .2s var(--ease),color .2s var(--ease)}
a.open:hover{background:var(--link);color:#fff;text-decoration:none}
td.acts{white-space:nowrap;text-align:right}td.acts>*+*{margin-left:var(--s1)}
/* Cost Optimization 탭 (static/cost.js) — 기존 토큰만 사용 */
.cx-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);margin-top:var(--s5)}.cx-grid>.card{margin:0}
.cx-svg{width:100%;height:auto;display:block}.cx-donut{width:180px;height:180px;flex:none}
.cx-row{display:flex;gap:var(--s5);align-items:center}.cx-tbl td:first-child{white-space:nowrap}.cx-tbl td{padding:6px var(--s2);font-size:13px}.cx-tbl td.r{white-space:nowrap}.cx-tbl .r{text-align:right}
.cx-leg{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:var(--s2)}.cx-leg i,.cx-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.cx-v{font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.02em}.cx-na{color:var(--orange);font-size:14px}
.cx-tip{color:var(--link);cursor:help;font-size:13px;margin-left:2px}details.card>summary{cursor:pointer}
@media (max-width:760px){.cx-grid{grid-template-columns:1fr}.cx-row{flex-direction:column}}
</style></head><body>
<header><div class="hdr"><a href="/" class="logo" title="AI Assessment"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><circle cx="12" cy="12" r="3"/></svg></a><nav><a href="/">프로젝트</a><a href="/admin" id="nav-admin" style="display:none">사용자 관리</a><a href="/admin/deleted" id="nav-deleted" style="display:none">삭제된 프로젝트</a></nav>
<span class="me" id="me"></span></div></header>
<main id="app">불러오는 중…</main>
<script src="/static/cost.js?v=20261022b"></script>
<script src="/static/arch.js?v=20261022b"></script>
<script src="/static/asis.js?v=06f2510bd654d557"></script>
<script src="/static/assessment-workflow.js?v=20261022d"></script>
<script>
const $=s=>document.querySelector(s);const api=async(u,o={})=>{o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});const r=await fetch(u,o);if(r.status===401){location='/login?next='+encodeURIComponent(location.pathname);return}if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():r};
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let Q=[],TRK={},ME=null,STATE=null,curTopic=null,curArea='A',TAB='infra',INFRA=null;
async function boot(){ME=await api('/api/aicaf/me');$('#me').innerHTML=`${esc(ME.name)} · <a href="/password">비밀번호 변경</a> · <a href="/logout">로그아웃</a>`;if(ME.is_admin){$('#nav-admin').style.display='';$('#nav-deleted').style.display=''}TRK=await api('/api/aicaf/tracks');route()}
function route(){const p=location.pathname;if(p.startsWith('/interview/'))return interview(+p.split('/')[2]);if(p==='/infra')return infra();if(p==='/admin')return admin();if(p==='/admin/deleted')return deletedProjects();return home()}
function badge(t){const m=TRK[t];return m?`<span class="pill trk-${t}" title="${esc(m.desc)}">${esc(m.label)}</span>`:''}
const ROLE_KO={manager:'프로젝트 관리자',interviewer:'인터뷰어',viewer:'조회만'};
async function home(){const list=await api('/api/aicaf/assessments');
const form=ME.can_create?`<div class="card np"><h2><b>새 프로젝트.</b> 고객 유형부터 선택하세요.</h2>
<div class="lbl">1. 고객 유형 <span class="hint">생성 후에는 바꿀 수 없습니다</span></div>
<div class="trkc" id="trk"><label class="t-new"><input type="radio" name="trk" value="new"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><rect x="8" y="8" width="8" height="8" rx="2"/></svg></span><div class="tx"><b>신규구축</b><span>AI를 아직 쓰지 않는 고객. <em class="c-blue">도입 준비도와 랜딩존 설계</em>를 중심으로.</span></div><i class="chk"></i></label><label class="t-ex"><input type="radio" name="trk" value="existing"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg></span><div class="tx"><b>기구축</b><span>AI를 이미 쓰는 고객. <em class="c-purple">운영·비용·거버넌스 최적화</em>를 중심으로.</span></div><i class="chk"></i></label></div>
<div class="lbl">2. 프로젝트 정보</div>
<div class="fg"><div><small>고객명 *</small><input id="cu" placeholder="예: LGE"></div><div><small>프로젝트명</small><input id="ti" placeholder="예: ThinQ 분석"></div><div><small>대표 인터뷰어</small><input id="iv" value="${esc(ME.name)}"></div></div>
<div class="lbl">3. 고객측 보고 담당자 <span class="muted" style="font-weight:400">(선택)</span></div>
<div class="fg"><div><small>이름</small><input id="cn" placeholder="홍길동"></div><div><small>직책</small><input id="cr" placeholder="IT 팀장"></div><div><small>이메일</small><input id="ce" placeholder="name@company.com"></div></div>
<div class="act"><p class="muted" style="margin:0">고객 유형에 따라 인터뷰 문항·채점·보고서가 달라집니다. 만든 사람이 프로젝트 관리자가 되며, 프로젝트 안에서 동료와 권한(관리자·인터뷰어·조회만)을 추가할 수 있습니다.</p><button onclick="create()">프로젝트 만들기</button></div></div>`
:`<div class="card muted">프로젝트 관리자가 추가해 준 프로젝트만 보입니다. 새 프로젝트를 만들려면 관리자에게 '프로젝트 관리자' 권한을 요청하세요.</div>`;
const qx=`<div class="card row"><b>인터뷰 질문지(엑셀)</b><span class="muted">현장 기록용 빈 양식</span>${Object.entries(TRK).map(([k,m])=>`<a href="/api/aicaf/questionnaire/${k}.xlsx"><button class="sec">${esc(m.label)} 질문지 받기</button></a>`).join('')}</div>`;

async function voiceCommit(aid){const b=$('#vp-commit');b.disabled=true;b.textContent='등록 중…';const r=await fetch('/api/aicaf/voiceprint/commit',{method:'POST'});const d=await r.json();

async function voiceReset(aid){if(!confirm('등록된 목소리를 지우고 다시 등록할까요?'))return;await fetch('/api/aicaf/voiceprint',{method:'DELETE'});await load(aid);render(aid)}
let REC=null;
async function rec(aid,qid,supp){if(REC){REC.stop();return}
const sfx=supp?'-s':'';const btn=$('#r-'+qid+sfx),live=$('#l-'+qid+sfx),ta=$('#t-'+qid);
const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
const ctx=new AudioContext();const src=ctx.createMediaStreamSource(stream);
await ctx.audioWorklet.addModule('/static/pcm.js');const node=new AudioWorkletNode(ctx,'pcm16k');src.connect(node);
const ws=new WebSocket(`wss://${location.host}/ws/transcribe?aid=${aid}&qid=${qid}${supp?'&mode=supp':''}`);ws.binaryType='arraybuffer';
let base=(ta.value?ta.value+'\n':'')+(supp?'[보완 인터뷰]\n':'');
node.port.onmessage=e=>{if(ws.readyState===1)ws.send(e.data)};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='partial')live.textContent='… '+m.text;if(m.type==='final'){base+=m.text+' ';ta.value=base;live.textContent=''}if(m.type==='error'){alert(m.text)}};
const stop=async()=>{try{ws.readyState===1&&ws.send('stop')}catch(e){}stream.getTracks().forEach(t=>t.stop());ctx.close();btn.classList.remove('on');btn.innerHTML='<i class="dot"></i>'+(supp?'보완 답변 녹음':'녹음·받아쓰기');REC=null;setTimeout(async()=>{await load(aid);render(aid)},2500)};
ws.onclose=e=>{if(REC){live.textContent='⚠ 서버 연결이 끊겨 녹음이 중지됐습니다. 지금까지 내용은 저장됩니다. 다시 녹음을 누르면 이어서 기록됩니다.';stop()}};btn.classList.add('on');btn.innerHTML='<i class="sq"></i>중지';REC={stop}}
